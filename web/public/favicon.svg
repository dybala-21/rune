            stroke-dasharray="16.59 24.88" transform="rotate(-70 16 16)"/>
    <circle cx="16" cy="16" r="9.9" stroke="#2C7E9B" stroke-width="1.7"
            stroke-dasharray="10.54 20.56" transform="rotate(64 16 16)"/>
    <circle cx="16" cy="16" r="6.6" stroke="#2C7E9B" stroke-width="1.7"
            stroke-dasharray="6.22 14.51" transform="rotate(-160 16 16)"/>
    <circle cx="16" cy="16" r="13.2" stroke="#42D0F2" stroke-width="1.7"
            stroke-dasharray="14.28 82.94" transform="rotate(-70 16 16)"/>
  </g>
  <circle cx="16" cy="16" r="2.6" fill="#42D0F2"/>
