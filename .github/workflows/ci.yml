name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build web UI
        run: cd web && npm ci && npm run build
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff check
        run: uv run ruff check .

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build web UI
        run: cd web && npm ci && npm run build
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Install test browser
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/rune-playwright"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          uv run playwright install --with-deps chromium
      - name: Allow test Chromium to create its sandbox
        shell: bash
        run: |
          # Ubuntu requires a user-namespace grant for these downloaded executables.
          browser_profile="$RUNNER_TEMP/rune-playwright.apparmor"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\n' > "$browser_profile"
          browser_count=0
          while IFS= read -r -d '' executable; do
            test -x "$executable"
            browser_count=$((browser_count + 1))
            printf 'profile rune-playwright-%s "%s" flags=(unconfined) {\n  userns,\n}\n' \
              "$browser_count" "$executable" >> "$browser_profile"
          done < <(find "$PLAYWRIGHT_BROWSERS_PATH" -type f \( -name chrome -o -name chrome-headless-shell \) -print0)
          test "$browser_count" -gt 0
          sudo install -m 0644 "$browser_profile" /etc/apparmor.d/rune-playwright
          sudo apparmor_parser -r /etc/apparmor.d/rune-playwright
      - name: Check sandboxed browser startup
        timeout-minutes: 1
        run: |
          uv run python - <<'PY'
          import asyncio

          from rune.capabilities.browser.core import _get_browser
          from rune.capabilities.browser.session import browser_session

          async def check():
              async with browser_session():
                  _, page = await _get_browser("managed")
                  await page.set_content("<title>Rune browser check</title>")
                  assert await page.title() == "Rune browser check"

          asyncio.run(check())
          PY
      - name: Run tests
        # Browser action regressions use Chromium, including its actionability checks.
        run: uv run pytest tests/ -q --tb=short
      - name: Run web regression tests
        env:
          RUNE_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: cd web && npm test

  # Fresh install with no dev extras, then import. lint and test both run
  # on `uv sync --extra dev`, so a runtime dependency missing from the base
  # install — the break a user hits first — would pass CI unseen.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fresh install, no dev extras
        run: uv sync
      - name: Import and run the entry point
        run: |
          uv run python -c "import rune.cli.main, rune.agent.loop; print('imports ok')"
          uv run python -m rune.cli.main --version

  # A safety change that softens a verdict is the one failure this repo
  # cannot notice by reading the diff. Both checks below found real bugs
  # before they were jobs: the fuzzer caught two bypasses that made
  # `rm -rf /etc` read as safe, and the differ is the only thing that
  # answers "is anything more permissive than the branch we came from".
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: No rewriting of a dangerous command reads as milder
        run: |
          uv run python scripts/safety_verdict_fuzz.py | tee fuzz.out
          grep -q ", 0 weakened the verdict" fuzz.out
      - name: Nothing is more permissive than the base branch
        if: github.event_name == 'pull_request'
        run: |
          git worktree add /tmp/base ${{ github.event.pull_request.base.sha }}
          uv run python scripts/safety_verdict_diff.py . > /tmp/head.json
          uv run python scripts/safety_verdict_diff.py /tmp/base > /tmp/base.json
          uv run python scripts/safety_verdict_gate.py /tmp/base.json /tmp/head.json
